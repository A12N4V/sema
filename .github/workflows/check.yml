name: check

on:
  push:
    branches: [main, v2-foundations]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # uv reads backend/.python-version and fetches CPython 3.11 itself, so
      # there is no setup-python step: the pin lives in one place.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: |
          cd backend && uv sync --group dev --frozen
          cd ../frontend && npm ci

      - name: install chromium
        run: cd frontend && npx playwright install --with-deps chromium

      # PyVista renders the 3D scalp field and the inflated brain offscreen,
      # which needs a GL context that a headless runner does not have.
      - name: run the checks
        run: xvfb-run -a ./scripts/check.sh e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
