name: pages

# The static frontend at https://a12n4v.github.io/sema/. Pages serves files
# only, so the Python API (MNE, scanpy, pydeseq2) runs elsewhere: set the repo
# variable SEMA_API_ORIGIN to it (e.g. https://<user>-sema.hf.space) and allow
# https://a12n4v.github.io in that server's SEMA_CORS_ORIGINS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend
        env:
          SEMA_BASE: /sema/
          VITE_API_ORIGIN: ${{ vars.SEMA_API_ORIGIN }}
      # Pages has no SPA fallback: an unknown path (a deep link like /sema/p/<run>)
      # gets 404.html, so make that the app too.
      - run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
