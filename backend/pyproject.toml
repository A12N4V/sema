[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eegvis"
version = "0.2.0"
description = "A browser workbench over MNE-Python — load, clean, analyse, localise, export a reproducible script."
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "mne>=1.7",
    "numpy>=1.26,<2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "scikit-learn>=1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
icalabel = ["mne-icalabel>=0.7"]
connectivity = ["mne-connectivity>=0.7"]
bids = ["mne-bids>=0.15"]

[project.scripts]
eegvis = "eegvis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eegvis*"]
